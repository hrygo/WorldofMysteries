[project]
name = "world-of-mysteries-engine"
version = "0.1.0"
description = "Local Engine Service for World of Mysteries"
requires-python = ">=3.14.0"
dependencies = [
    "agentscope==2.0.8",
    "pydantic>=2.10.0",
    "aiosqlite>=0.20.0",
    "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "../contracts/tests"]
pythonpath = [".."]

[tool.ruff]
target-version = "py314"
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["domain", "application", "infrastructure", "ai", "contracts"]
