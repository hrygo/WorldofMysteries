name: Temporary Voice V01 regression capsule pack
on:
  push:
    branches: ['tmp/voice-v01-debug-20260919']
    paths: ['.github/workflows/tmp-voice-v01-qa-pack.yml']
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/voice-v01-media-contract
          fetch-depth: 0
          persist-credentials: true
      - name: Pack regression capsule
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GitHub Actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/agent_capsule.py pack             --role AGT-QA             --task-id VOICE-V01-REGRESSION             --title 'Voice V01 cross-module Swift compile regression'             --focus 'test_app_engine_session MediaProtocol EngineIPCClient Swift compile'             --target-ref origin/main
          git add .agents/capsules/VOICE-V01-REGRESSION.json
          git commit -m 'chore(voice): pack VOICE-V01-REGRESSION capsule'
          git push origin HEAD:refs/heads/feat/voice-v01-media-contract
