name: Temporary Voice V09 Durable Intake Receipt Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact W-V09 intake head
        uses: actions/checkout@v7
        with:
          ref: d8170bb4e0afddebf0c1b4a8697af7871ad6b273
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: auto
          cache-dependency-glob: "engine/uv.lock"
      - name: Select Xcode toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version
      - name: Verify capsule and print Work Receipt
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d8170bb4e0afddebf0c1b4a8697af7871ad6b273"
          python3 scripts/agent_capsule.py verify \
            --capsule .agents/capsules/VOICE-V09-DURABLE-TURN-INTAKE.json
          receipt=".agents/receipts/VOICE-V09-DURABLE-TURN-INTAKE/d8170bb4e0af.json"
          test -f "$receipt"
          echo "===WORK_RECEIPT_BEGIN==="
          cat "$receipt"
          echo "===WORK_RECEIPT_END==="
