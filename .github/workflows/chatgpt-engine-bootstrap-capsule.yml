name: ChatGPT Engine Bootstrap Capsule

on:
  push:
    branches: [fix/engine-bootstrap-off-main-actor]
    paths:
      - .github/workflows/chatgpt-engine-bootstrap-capsule.yml

permissions:
  contents: write

jobs:
  capsule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Pack lifecycle task
        run: |
          python3 scripts/agent_capsule.py pack \
            --role AGT-MAC \
            --task-id MAC-ENGINE-BOOTSTRAP-OFF-MAIN \
            --title "Bootstrap bundled Engine independently of UI MainActor scheduling" \
            --focus "EngineAppDelegate,AppState,EngineProcessManager,startAndConnect,bootstrap" \
            --risk-class medium
      - name: Commit capsule and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/capsules/MAC-ENGINE-BOOTSTRAP-OFF-MAIN.json
          git rm .github/workflows/chatgpt-engine-bootstrap-capsule.yml
          git commit -m "chore(macos): initialize Engine bootstrap lifecycle task"
          git push origin HEAD:fix/engine-bootstrap-off-main-actor
