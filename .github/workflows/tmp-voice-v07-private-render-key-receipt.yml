name: Temporary Voice V07 Private RenderKey Receipt Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact private RenderKey head
        uses: actions/checkout@v7
        with:
          ref: e73415b2f9ea866cb96ad8bfc6605fbfd0c95259
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: auto
          cache-dependency-glob: "engine/uv.lock"
      - name: Select Xcode toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version
      - name: Verify capsule and print Work Receipt
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e73415b2f9ea866cb96ad8bfc6605fbfd0c95259"
          python3 scripts/agent_capsule.py verify \
            --capsule .agents/capsules/VOICE-V07-PRIVATE-RENDER-KEY.json
          receipt=".agents/receipts/VOICE-V07-PRIVATE-RENDER-KEY/e73415b2f9ea.json"
          test -f "$receipt"
          echo "===WORK_RECEIPT_BEGIN==="
          cat "$receipt"
          echo "===WORK_RECEIPT_END==="
