name: ChatGPT Resolve W-V03 Control Python Sync

on:
  push:
    branches:
      - feat/voice-v03-control-python
    paths:
      - .github/workflows/chatgpt-sync-wv03-control-python.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve known additive conflicts against latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-sync-wv03-control-python.yml
          git commit -m "ci(voice): remove temporary W-V03 sync workflow"

          git fetch origin main
          set +e
          git merge --no-edit origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ] && [ "$merge_status" -ne 1 ]; then
            exit "$merge_status"
          fi

          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          expected="$(printf '%s\n'             engine/infrastructure/audio/__init__.py             engine/tests/test_audio_adapter.py | sort)"
          test "$conflicts" = "$expected"

          git checkout --theirs engine/infrastructure/audio/__init__.py
          git checkout --theirs engine/tests/test_audio_adapter.py

          python3 - <<'PY'
          from pathlib import Path

          init_path = Path("engine/infrastructure/audio/__init__.py")
          init = init_path.read_text()
          voice_import = """from .voice_control import (
              PendingVoiceRender,
              PendingVoiceRenderRegistry,
              VoiceRenderAccepted,
              VoiceRenderControlError,
              VoiceRenderControlRequest,
          )

          """
          marker = "__all__ = [\n"
          if voice_import not in init:
              if marker not in init:
                  raise SystemExit("missing __all__ marker")
              init = init.replace(marker, voice_import + marker, 1)

          exports = [
              "PendingVoiceRender",
              "PendingVoiceRenderRegistry",
              "VoiceRenderAccepted",
              "VoiceRenderControlError",
              "VoiceRenderControlRequest",
          ]
          export_marker = '    "ProbeHttpResponse",\n'
          if export_marker not in init:
              raise SystemExit("missing export marker")
          missing = [name for name in exports if f'    "{name}",\n' not in init]
          if missing:
              block = "".join(f'    "{name}",\n' for name in missing)
              init = init.replace(export_marker, block + export_marker, 1)
          init_path.write_text(init)

          test_path = Path("engine/tests/test_audio_adapter.py")
          tests = test_path.read_text()
          import_marker = "    ProbeHttpResponse,\n"
          imports = [
              "PendingVoiceRenderRegistry",
              "VoiceRenderControlError",
              "VoiceRenderControlRequest",
          ]
          if import_marker not in tests:
              raise SystemExit("missing test import marker")
          missing_imports = [name for name in imports if f"    {name},\n" not in tests]
          if missing_imports:
              block = "".join(f"    {name},\n" for name in missing_imports)
              tests = tests.replace(import_marker, block + import_marker, 1)

          block = r'''

          def _voice_render_request(**overrides):
              payload = {
                  "schema_version": "1.0",
                  "speech_unit_id": "speech_001",
                  "turn_id": "turn_001",
                  "story_revision": 42,
                  "narrative_block_id": "narrative_001",
                  "segment_index": 0,
                  "performance_plan_id": "perf_001",
                  "spoken_text": "雾中的脚步声停在了门外。",
                  "voice_id": "narrator_mystic",
                  "expected_voice_revision": "vr_" + "a" * 40,
                  "expected_model_revision": "b" * 40,
                  "media_stream_id": "media_001",
                  "generation": 7,
                  "speed": 1.0,
                  "language": "zh",
              }
              payload.update(overrides)
              return payload


          def test_voice_render_control_provider_projection_is_minimal():
              request = VoiceRenderControlRequest.model_validate(_voice_render_request())
              assert request.provider_tts_fields() == {
                  "text": "雾中的脚步声停在了门外。",
                  "voice": "narrator_mystic",
                  "speed": 1.0,
                  "expected_voice_revision": "vr_" + "a" * 40,
              }
              projected = request.provider_tts_fields()
              assert "turn_id" not in projected
              assert "story_revision" not in projected
              assert "media_stream_id" not in projected
              assert "expected_model_revision" not in projected


          @pytest.mark.parametrize(
              "patch",
              [
                  {"__unknown": True},
                  {"story_revision": -1},
                  {"expected_model_revision": "bad"},
                  {"spoken_text": "   "},
                  {"speed": 4.1},
              ],
          )
          def test_voice_render_control_rejects_invalid_execution_shapes(patch):
              with pytest.raises(Exception):
                  VoiceRenderControlRequest.model_validate(_voice_render_request(**patch))


          def test_pending_voice_render_registry_is_one_time_and_generation_bound():
              registry = PendingVoiceRenderRegistry()
              accepted = registry.register(_voice_render_request())
              assert accepted.speech_unit_id == "speech_001"
              assert accepted.media_stream_id == "media_001"
              assert accepted.generation == 7
              assert len(registry) == 1

              pending = registry.consume("media_001", 7)
              assert pending.render_id == accepted.render_id
              assert pending.request.spoken_text == "雾中的脚步声停在了门外。"
              assert len(registry) == 0

              with pytest.raises(VoiceRenderControlError, match="voice_render_not_found"):
                  registry.consume("media_001", 7)


          def test_pending_voice_render_generation_mismatch_burns_entry():
              registry = PendingVoiceRenderRegistry()
              registry.register(_voice_render_request())
              with pytest.raises(VoiceRenderControlError, match="voice_render_generation_mismatch"):
                  registry.consume("media_001", 8)
              assert len(registry) == 0


          def test_pending_voice_render_registry_expires_and_is_bounded():
              now = [100.0]
              registry = PendingVoiceRenderRegistry(
                  max_entries=1,
                  ttl_seconds=5,
                  clock=lambda: now[0],
              )
              registry.register(_voice_render_request())
              with pytest.raises(VoiceRenderControlError, match="voice_render_registry_capacity"):
                  registry.register(_voice_render_request(media_stream_id="media_002"))

              now[0] = 106.0
              assert len(registry) == 0
              accepted = registry.register(_voice_render_request(media_stream_id="media_002"))
              assert accepted.media_stream_id == "media_002"
          '''
          if "def _voice_render_request(**overrides):" not in tests:
              tests += block
          test_path.write_text(tests)
          PY

          git add engine/infrastructure/audio/__init__.py                   engine/tests/test_audio_adapter.py                   engine/infrastructure/audio/voice_control.py                   .agents/capsules/VOICE-V03-CONTROL-PYTHON.json
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          git commit -m "Merge latest main into W-V03 Python control runtime"
          git push origin HEAD:feat/voice-v03-control-python
