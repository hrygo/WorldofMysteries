name: Temporary W-V09 Input Integration Preflight

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact W-V09 input integration head
        uses: actions/checkout@v7
        with:
          ref: 009348c5d55716667e072cc376746dc8c11a29b8
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
      - name: Architecture fitness
        run: python3 scripts/check_architecture_fitness.py
      - name: Focused W-V09 integration tests
        working-directory: engine
        run: uv run --locked --extra dev pytest -q tests/test_turn_input.py tests/test_turn_input_integration.py tests/test_turn_intake_repository.py
