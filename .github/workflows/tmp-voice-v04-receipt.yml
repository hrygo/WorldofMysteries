name: Temporary Voice V04 Receipt Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact Voice V04 head
        uses: actions/checkout@v7
        with:
          ref: e344232ea770aa4c74723952cdf47d878436a8ff
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: auto
          cache-dependency-glob: "engine/uv.lock"

      - name: Select Xcode toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Verify capsule and sign Work Receipt
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e344232ea770aa4c74723952cdf47d878436a8ff"
          python3 scripts/agent_capsule.py verify             --capsule .agents/capsules/VOICE-V04-BINDING-PERSISTENCE.json
          receipt="$(find .agents/receipts/VOICE-V04-BINDING-PERSISTENCE -name '*.json' -type f | sort | tail -1)"
          test -n "$receipt"
          echo "===WORK_RECEIPT_BEGIN==="
          cat "$receipt"
          echo "===WORK_RECEIPT_END==="
