name: Temporary Voice V06 Duplex AEC Receipt Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact duplex AEC head
        uses: actions/checkout@v7
        with:
          ref: c4968dd0c7b00892c796f1b9e4e6635e2bf53906
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: auto
          cache-dependency-glob: "engine/uv.lock"
      - name: Select Xcode toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version
      - name: Verify capsule and print Work Receipt
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c4968dd0c7b00892c796f1b9e4e6635e2bf53906"
          python3 scripts/agent_capsule.py verify \
            --capsule .agents/capsules/VOICE-V06-DUPLEX-AEC.json
          receipt=".agents/receipts/VOICE-V06-DUPLEX-AEC/c4968dd0c7b0.json"
          test -f "$receipt"
          echo "===WORK_RECEIPT_BEGIN==="
          cat "$receipt"
          echo "===WORK_RECEIPT_END==="
