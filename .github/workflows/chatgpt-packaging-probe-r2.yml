name: ChatGPT Packaging Probe Capsule R2

on:
  push:
    branches:
      - fix/packaging-release-app-probe
    paths:
      - .github/workflows/chatgpt-packaging-probe-r2.yml

permissions:
  contents: write

jobs:
  capsule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Generate R2 with packaging test grant
        run: |
          python3 scripts/agent_capsule.py pack \
            --role AGT-ARB \
            --task-id PACKAGING-RELEASE-APP-PROBE-R2 \
            --title "Make Release App Engine bootstrap probe deterministic" \
            --focus "build_macos_package,release_app_probe,await_engine,packaging" \
            --risk-class high \
            --grant-privileged "engine/tests/test_macos_packaging.py" \
            --depends-on PACKAGING-RELEASE-APP-PROBE-R1
          python3 scripts/agent_capsule.py show \
            --capsule .agents/capsules/PACKAGING-RELEASE-APP-PROBE-R2.json
      - name: Commit capsule and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/capsules/PACKAGING-RELEASE-APP-PROBE-R2.json
          git rm .github/workflows/chatgpt-packaging-probe-r2.yml
          git commit -m "chore(packaging): authorize release-app probe tests"
          git push origin HEAD:fix/packaging-release-app-probe
