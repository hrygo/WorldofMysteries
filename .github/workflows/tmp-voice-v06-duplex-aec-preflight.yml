name: Temporary Voice V06 Duplex AEC Focused Preflight

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact duplex AEC head
        uses: actions/checkout@v7
        with:
          ref: 4536315fa532856f2fb90096f99f52b19c9d7030
          fetch-depth: 0
          persist-credentials: false
      - name: Select Xcode toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version
      - name: Swift focused tests
        working-directory: macos-app
        run: swift test --scratch-path .build --filter 'VoiceInputPTTSessionTests|MicrophoneCaptureTests|NativePlaybackTests'
      - name: Xcode app build
        working-directory: macos-app
        run: xcodebuild -project WorldOfMysteries.xcodeproj -scheme WorldOfMysteries -configuration Debug -destination platform=macOS,arch=arm64 -derivedDataPath ../.hacf/run/duplex-aec-preflight build
