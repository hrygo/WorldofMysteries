name: Temporary Voice V01 lifecycle capsule pack
on:
  push:
    branches: ['tmp/voice-v01-lifecycle-pack-20260919']
    paths: ['.github/workflows/tmp-voice-v01-lifecycle-pack.yml']
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/voice-v01-media-contract
          fetch-depth: 0
          persist-credentials: true
      - name: Pack lifecycle task
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GitHub Actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/agent_capsule.py pack             --role AGT-MAC             --task-id VOICE-V01-APP-BOOTSTRAP             --title 'Move Engine bootstrap to process App lifecycle'             --focus 'EngineAppDelegate,AppState,MyApp,ContentView,EngineSessionTests,startAndConnect,applicationDidFinishLaunching'             --target-ref origin/main
          git add .agents/capsules/
          git commit -m 'chore(voice): pack W-V01 app bootstrap task capsule'
          git push origin HEAD:refs/heads/feat/voice-v01-media-contract
