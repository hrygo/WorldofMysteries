name: ChatGPT W-V00 Capability Verify

on:
  push:
    branches:
      - feat/voice-v00-effective-capabilities
    paths:
      - .github/workflows/chatgpt-wv00-capabilities-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: auto
          cache-dependency-glob: engine/uv.lock
      - name: Remove temporary verifier before scope verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-wv00-capabilities-verify.yml
          git commit -m "ci(voice): remove temporary W-V00 verifier"
          git push origin HEAD:feat/voice-v00-effective-capabilities
      - name: Verify repository-native capability task
        run: |
          python3 scripts/agent_capsule.py verify \
            --capsule .agents/capsules/VOICE-V00-EFFECTIVE-CAPABILITIES.json \
            --cwd "$GITHUB_WORKSPACE"
      - name: Commit fresh Work Receipt
        run: |
          git add .agents/receipts/VOICE-V00-EFFECTIVE-CAPABILITIES/
          git diff --cached --check
          git commit -m "chore(evidence): attach W-V00 capability Work Receipt"
          git push origin HEAD:feat/voice-v00-effective-capabilities
