name: Temporary Voice V07 Prefetch Focused Preflight

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact prefetch head
        uses: actions/checkout@v7
        with:
          ref: 7327f46b015d4162c143f49534293143f0a96f12
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: auto
          cache-dependency-glob: "engine/uv.lock"
      - name: Architecture fitness
        run: python3 scripts/check_architecture_fitness.py
      - name: Focused AudioTake prefetch tests
        working-directory: engine
        run: uv run --locked --extra dev pytest -q tests/test_audio_take_store.py tests/test_audio_take_coordinator.py tests/test_audio_prefetch.py
