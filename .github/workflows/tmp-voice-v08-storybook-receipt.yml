name: Temporary Voice V08 StoryBook Track Receipt Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact StoryBook track head
        uses: actions/checkout@v7
        with:
          ref: 4eac018364af9dd7c92773304a75596a6aaa4c55
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: auto
          cache-dependency-glob: "engine/uv.lock"
      - name: Select Xcode toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version
      - name: Verify capsule and print Work Receipt
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4eac018364af9dd7c92773304a75596a6aaa4c55"
          python3 scripts/agent_capsule.py verify \
            --capsule .agents/capsules/VOICE-V08-STORYBOOK-TRACKS.json
          receipt=".agents/receipts/VOICE-V08-STORYBOOK-TRACKS/4eac018364af.json"
          test -f "$receipt"
          echo "===WORK_RECEIPT_BEGIN==="
          cat "$receipt"
          echo "===WORK_RECEIPT_END==="
