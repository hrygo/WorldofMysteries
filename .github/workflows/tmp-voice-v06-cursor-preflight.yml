name: Temporary Voice V06 DeliveryCursor R2 Receipt Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact DeliveryCursor head
        uses: actions/checkout@v7
        with:
          ref: ee159b2dc4f9b5e448e2345f99d5c80722890bcf
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: auto
          cache-dependency-glob: "engine/uv.lock"
      - name: Select Xcode toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version
      - name: Verify R2 capsule and print Work Receipt
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ee159b2dc4f9b5e448e2345f99d5c80722890bcf"
          python3 scripts/agent_capsule.py verify \
            --capsule .agents/capsules/VOICE-V06-DELIVERY-CURSOR-R2.json
          receipt=".agents/receipts/VOICE-V06-DELIVERY-CURSOR/ee159b2dc4f9.json"
          test -f "$receipt"
          echo "===WORK_RECEIPT_BEGIN==="
          cat "$receipt"
          echo "===WORK_RECEIPT_END==="
