name: Temporary Voice V06 DeliveryCursor Focused Preflight

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact DeliveryCursor head
        uses: actions/checkout@v7
        with:
          ref: 90a91ba4ae1e57f074f49de511a31832a02ef541
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: auto
          cache-dependency-glob: "engine/uv.lock"
      - name: Architecture fitness
        run: python3 scripts/check_architecture_fitness.py
      - name: Focused cursor and migration tests
        working-directory: engine
        run: uv run --locked --extra dev pytest -q tests/test_delivery_cursor_repository.py tests/test_story_session_migration.py
