name: PR Gate Reporter & Sticky Comment

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  report-pr-status:
    name: "Generate PR Quality Gate Report"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # 证据卡片必须解析 PR 变更面：`git diff origin/<base>...HEAD` 需要共同祖先，
          # 默认浅克隆（fetch-depth: 1）会让 diff 以 "no merge base" 失败并被误判为
          # 「本 PR 未附带胶囊」。此处与 capsule-audit.yml 保持一致的完整历史口径。
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Generate PR Markdown Report
        run: |
          python3 scripts/generate_pr_report.py

      - name: Post or Update Sticky PR Comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const reportPath = path.join('.hacf', 'tmp', 'pr_report.md');
            const reportBody = fs.readFileSync(reportPath, 'utf8');
            const commentHeader = '## 🛡️ 《诡秘世界》协同证据摘要';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c => c.body.includes(commentHeader));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: reportBody
              });
              console.log('Updated existing PR quality gate report comment.');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: reportBody
              });
              console.log('Created new PR quality gate report comment.');
            }
