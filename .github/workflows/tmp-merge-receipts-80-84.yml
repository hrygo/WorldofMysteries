name: Temporary merge receipts PR80 PR84
on:
  push:
    branches: [tmp/merge-receipts-80-84-eb2bf32]
permissions:
  contents: read
jobs:
  pr80:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 13190fb91e28369c6b794d5de426c3903ec675e4
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      - name: Verify PR80 exact source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 13190fb91e28369c6b794d5de426c3903ec675e4
          test "$(git rev-parse origin/main)" = eb2bf327ddf094bfc880238619a9bfc12a8eb123
          mkdir -p "$RUNNER_TEMP/pr80"
          export WOM_SPM_SCRATCH="$RUNNER_TEMP/pr80-spm"
          python3 scripts/agent_capsule.py verify --capsule .agents/capsules/DOMAIN-CONTRACT-PARITY.json --cwd "$PWD" 2>&1 | tee "$RUNNER_TEMP/pr80/verify.log"
          HACF_STRICT_EVIDENCE=1 python3 scripts/capsule_audit.py --base-ref origin/main --head-ref HEAD 2>&1 | tee "$RUNNER_TEMP/pr80/strict-audit.log"
      - name: Collect PR80
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pr80/receipts"
          if [ -d .agents/receipts/DOMAIN-CONTRACT-PARITY ]; then cp -R .agents/receipts/DOMAIN-CONTRACT-PARITY "$RUNNER_TEMP/pr80/receipts/"; fi
          if [ -d .hacf/logs ]; then cp -R .hacf/logs "$RUNNER_TEMP/pr80/"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: PR80-r2-merge-receipt
          path: ${{ runner.temp }}/pr80/
          retention-days: 7
          include-hidden-files: true

  pr84:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 49c70ed111bd5c585da41b76c4f4e5a551a527c5
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      - name: Verify PR84 exact source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 49c70ed111bd5c585da41b76c4f4e5a551a527c5
          test "$(git rev-parse origin/main)" = eb2bf327ddf094bfc880238619a9bfc12a8eb123
          mkdir -p "$RUNNER_TEMP/pr84"
          export WOM_SPM_SCRATCH="$RUNNER_TEMP/pr84-spm"
          python3 scripts/agent_capsule.py verify --capsule .agents/capsules/STORY-SESSION-SCHEMA-V2.json --cwd "$PWD" 2>&1 | tee "$RUNNER_TEMP/pr84/verify.log"
          HACF_STRICT_EVIDENCE=1 python3 scripts/capsule_audit.py --base-ref origin/main --head-ref HEAD 2>&1 | tee "$RUNNER_TEMP/pr84/strict-audit.log"
      - name: Collect PR84
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pr84/receipts"
          if [ -d .agents/receipts/STORY-SESSION-SCHEMA-V2 ]; then cp -R .agents/receipts/STORY-SESSION-SCHEMA-V2 "$RUNNER_TEMP/pr84/receipts/"; fi
          if [ -d .hacf/logs ]; then cp -R .hacf/logs "$RUNNER_TEMP/pr84/"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: PR84-r2-merge-receipt
          path: ${{ runner.temp }}/pr84/
          retention-days: 7
          include-hidden-files: true
