name: Temporary Voice V08 Replay Cleanup Receipt Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact Voice V08 replay cleanup head
        uses: actions/checkout@v7
        with:
          ref: 963d79a1d08c94f97084288b30a6fea60ffd6e7e
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: auto
          cache-dependency-glob: "engine/uv.lock"
      - name: Select Xcode toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version
      - name: Verify capsule and print Work Receipt
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "963d79a1d08c94f97084288b30a6fea60ffd6e7e"
          python3 scripts/agent_capsule.py verify \
            --capsule .agents/capsules/VOICE-V08-REPLAY-CLEANUP.json
          receipt=".agents/receipts/VOICE-V08-REPLAY-CLEANUP/963d79a1d08c.json"
          test -f "$receipt"
          echo "===WORK_RECEIPT_BEGIN==="
          cat "$receipt"
          echo "===WORK_RECEIPT_END==="
