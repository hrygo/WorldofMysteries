name: Temporary Voice V05 Narrative Persistence R2 Receipt Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact Voice V05 narrative persistence head
        uses: actions/checkout@v7
        with:
          ref: f42a6835d1e0ed929e415eca4d600ac1dff6f441
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: auto
          cache-dependency-glob: "engine/uv.lock"
      - name: Select Xcode toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version
      - name: Verify R2 capsule and print Work Receipt
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f42a6835d1e0ed929e415eca4d600ac1dff6f441"
          python3 scripts/agent_capsule.py verify \
            --capsule .agents/capsules/VOICE-V05-NARRATIVE-PERSISTENCE-R2.json
          receipt="$(find .agents/receipts/VOICE-V05-NARRATIVE-PERSISTENCE -name '*.json' -type f | sort | tail -1)"
          test -n "$receipt"
          echo "===WORK_RECEIPT_BEGIN==="
          cat "$receipt"
          echo "===WORK_RECEIPT_END==="
