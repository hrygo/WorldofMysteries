name: ChatGPT W-V03 Verify

on:
  push:
    branches:
      - feat/voice-v03-tts-playback
    paths:
      - .github/workflows/chatgpt-wv03-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'

      - name: Remove temporary verification workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-wv03-verify.yml
          git commit -m "ci(voice): clean W-V03 verification scaffold"
          git push origin HEAD:feat/voice-v03-tts-playback

      - name: Verify W-V03 with repository-owned gate
        run: |
          set -euo pipefail
          python3 scripts/agent_capsule.py verify \
            --capsule .agents/capsules/VOICE-V03-TTS-PLAYBACK.json \
            --cwd "$GITHUB_WORKSPACE"

      - name: Attach refreshed Work Receipt
        run: |
          set -euo pipefail
          git add .agents/receipts/VOICE-V03-TTS-PLAYBACK/
          if git diff --cached --quiet; then
            echo "No refreshed receipt produced"
            exit 1
          fi
          git diff --cached --check
          git commit -m "chore(evidence): refresh VOICE-V03-TTS-PLAYBACK Work Receipt"
          git push origin HEAD:feat/voice-v03-tts-playback
