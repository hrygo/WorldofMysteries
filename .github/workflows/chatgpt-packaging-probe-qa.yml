name: ChatGPT Packaging Probe QA Capsule

on:
  push:
    branches:
      - fix/packaging-release-app-probe
    paths:
      - .github/workflows/chatgpt-packaging-probe-qa.yml

permissions:
  contents: write

jobs:
  capsule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Generate QA capsule
        run: |
          python3 scripts/agent_capsule.py pack \
            --role AGT-QA \
            --task-id PACKAGING-RELEASE-APP-PROBE-QA \
            --title "Packaging Release App probe regression coverage" \
            --focus "test_macos_packaging,release_app_probe,await_engine" \
            --risk-class high \
            --depends-on PACKAGING-RELEASE-APP-PROBE-R2
          python3 scripts/agent_capsule.py show \
            --capsule .agents/capsules/PACKAGING-RELEASE-APP-PROBE-QA.json
      - name: Commit capsule and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/capsules/PACKAGING-RELEASE-APP-PROBE-QA.json
          git rm .github/workflows/chatgpt-packaging-probe-qa.yml
          git commit -m "chore(packaging): add probe QA capsule"
          git push origin HEAD:fix/packaging-release-app-probe
