name: Temporary W-V09 Input Routing Receipt Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact W-V09 input-routing head
        uses: actions/checkout@v7
        with:
          ref: afad448f66f1003c070376245d91103aa95ea714
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: auto
          cache-dependency-glob: "engine/uv.lock"
      - name: Select Xcode toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version
      - name: Verify capsule and print Work Receipt
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "afad448f66f1003c070376245d91103aa95ea714"
          python3 scripts/agent_capsule.py verify \
            --capsule .agents/capsules/VOICE-V09-INPUT-COMMAND-ROUTING.json
          receipt=".agents/receipts/VOICE-V09-INPUT-COMMAND-ROUTING/afad448f66f1.json"
          test -f "$receipt"
          echo "===WORK_RECEIPT_BEGIN==="
          cat "$receipt"
          echo "===WORK_RECEIPT_END==="
