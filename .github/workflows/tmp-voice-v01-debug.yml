name: Temporary Voice V01 Python diagnostics
on:
  push:
    branches: ['tmp/voice-v01-debug-20260919']
    paths: ['.github/workflows/tmp-voice-v01-debug.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 838a9a74c463ca863a1c8292feb8e0dacf00dbec
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: false
      - name: Full Python suite
        working-directory: engine
        shell: bash
        run: |
          set -o pipefail
          uv run --locked --extra dev pytest -q |& tee /tmp/voice-v01-python-full.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: voice-v01-python-full-diagnostics
          path: /tmp/voice-v01-python-full.log
          retention-days: 3
          if-no-files-found: warn
