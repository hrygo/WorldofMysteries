name: Temporary Voice V08 Authorization Focused Preflight

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact W-V08 authorization head
        uses: actions/checkout@v7
        with:
          ref: a61c4aaaca5cd306fa04e8be859adf2f9809e49b
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
      - name: Architecture fitness
        run: python3 scripts/check_architecture_fitness.py
      - name: Focused StoryBook authorization tests
        working-directory: engine
        run: uv run --locked --extra dev pytest -q tests/test_audio_track_repository.py
