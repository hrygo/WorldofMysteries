name: Temporary Voice V05 Sealed Speech Unit Receipt Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact sealed SpeechUnit head
        uses: actions/checkout@v7
        with:
          ref: dd979d5ca53a2094afa690d6296ad53db0d1f1a6
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: auto
          cache-dependency-glob: "engine/uv.lock"
      - name: Select Xcode toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version
      - name: Verify capsule and print Work Receipt
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "dd979d5ca53a2094afa690d6296ad53db0d1f1a6"
          python3 scripts/agent_capsule.py verify \
            --capsule .agents/capsules/VOICE-V05-SEALED-SPEECH-UNIT.json
          receipt=".agents/receipts/VOICE-V05-SEALED-SPEECH-UNIT/dd979d5ca53a.json"
          test -f "$receipt"
          echo "===WORK_RECEIPT_BEGIN==="
          cat "$receipt"
          echo "===WORK_RECEIPT_END==="
