name: Temporary Voice V02 microphone capsule pack
on:
  push:
    branches: ['tmp/voice-v02-mic-pack-20260919']
    paths: ['.github/workflows/tmp-voice-v02-mic-pack.yml']
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/voice-v02-realtime-asr
          fetch-depth: 0
          persist-credentials: true
      - name: Pack microphone task
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GitHub Actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/agent_capsule.py pack             --role AGT-MAC             --task-id VOICE-V02-MIC-CAPTURE             --title 'Voice V02 sandboxed microphone capture'             --focus 'AVAudioEngine,microphone,audio-input,NSMicrophoneUsageDescription,PCM16,PTT'             --grant-privileged 'macos-app/Packaging/App.entitlements,macos-app/WorldOfMysteries.xcodeproj/project.pbxproj'             --risk-class privileged             --depends-on VOICE-V02-REALTIME-ASR             --target-ref origin/main
          git add .agents/capsules/
          git commit -m 'chore(voice): pack VOICE-V02-MIC-CAPTURE task capsule'
          git push origin HEAD:refs/heads/feat/voice-v02-realtime-asr
