name: Temporary Voice V04 Fork Receipt Verification R2

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact Voice fork head
        uses: actions/checkout@v7
        with:
          ref: 8472a32004944655f19aa82dd438c7ba4894d54d
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: auto
          cache-dependency-glob: "engine/uv.lock"
      - name: Select Xcode toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version
      - name: Verify capsule and print Work Receipt
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "8472a32004944655f19aa82dd438c7ba4894d54d"
          python3 scripts/agent_capsule.py verify \
            --capsule .agents/capsules/VOICE-V04-WORLDLINE-FORK-SNAPSHOT.json
          receipt="$(find .agents/receipts/VOICE-V04-WORLDLINE-FORK-SNAPSHOT -name '*.json' -type f | sort | tail -1)"
          test -n "$receipt"
          echo "===WORK_RECEIPT_BEGIN==="
          cat "$receipt"
          echo "===WORK_RECEIPT_END==="
