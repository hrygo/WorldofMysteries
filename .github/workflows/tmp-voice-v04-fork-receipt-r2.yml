name: Temporary Voice V04 Fork Receipt Verification Final

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact Voice fork head
        uses: actions/checkout@v7
        with:
          ref: 30b14dbfecebe018cddf8877774fcc3e683b1345
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: auto
          cache-dependency-glob: "engine/uv.lock"
      - name: Select Xcode toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version
      - name: Verify capsule and print Work Receipt
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "30b14dbfecebe018cddf8877774fcc3e683b1345"
          python3 scripts/agent_capsule.py verify \
            --capsule .agents/capsules/VOICE-V04-WORLDLINE-FORK-SNAPSHOT.json
          receipt=".agents/receipts/VOICE-V04-WORLDLINE-FORK-SNAPSHOT/30b14dbfeceb.json"
          test -f "$receipt"
          echo "===WORK_RECEIPT_BEGIN==="
          cat "$receipt"
          echo "===WORK_RECEIPT_END==="
