name: Temporary Voice V06 Playback Cursor Preflight

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact stacked head
        uses: actions/checkout@v7
        with:
          ref: eccef75da580bf3fd699f99353da11e8165c38d3
          fetch-depth: 0
          persist-credentials: false
      - name: Select Xcode toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version
      - name: Focused Swift playback cursor tests
        working-directory: macos-app
        run: swift test --scratch-path .build --filter EngineMediaPlayback
