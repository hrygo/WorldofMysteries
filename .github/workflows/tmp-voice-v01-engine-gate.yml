name: Temporary Voice V01 Engine gate
on:
  push:
    branches: ['tmp/voice-v01-pack-20260919']
    paths: ['.github/workflows/tmp-voice-v01-engine-gate.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 0406d8e87c4176d1b503d786df96f11917bf06f3
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: false
      - name: Architecture fitness
        run: python3 scripts/check_architecture_fitness.py
      - name: Voice and media tests
        working-directory: engine
        run: uv run --locked --extra dev pytest -q tests/test_audio_adapter.py ../contracts/tests/test_media_contract.py
