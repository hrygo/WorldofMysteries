name: Temporary W-V09 Input Command Preflight

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact W-V09 input-command head
        uses: actions/checkout@v7
        with:
          ref: f1495fdb4da4d33c7a9d8939b8e0028ce8949328
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
      - name: Architecture fitness
        run: python3 scripts/check_architecture_fitness.py
      - name: Focused W-V09 input command tests
        working-directory: engine
        run: uv run --locked --extra dev pytest -q tests/test_turn_input.py tests/test_turn_intake_repository.py
