name: Temporary Voice V07 Private RenderKey Preflight

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact private RenderKey head
        uses: actions/checkout@v7
        with:
          ref: 7ff8540b3c7a3f3fa8fc5052c77f8304a47c96d3
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: auto
          cache-dependency-glob: "engine/uv.lock"
      - name: Architecture fitness
        run: python3 scripts/check_architecture_fitness.py
      - name: Focused AudioTake store tests
        working-directory: engine
        run: uv run --locked --extra dev pytest -q tests/test_audio_take_store.py tests/test_story_session_migration.py
