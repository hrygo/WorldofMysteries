name: CI & Engineering Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Security Best Practice: Restrict top-level default permissions to read-only
permissions:
  contents: read

# Cancel redundant in-progress runs on new commits
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Decide the expensive platform gates from the exact changed path set.
  change-scope:
    name: "Determine CI Scope"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_python: ${{ steps.scope.outputs.run_python }}
      run_swift: ${{ steps.scope.outputs.run_swift }}
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - name: Checkout Code with History
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Classify changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only -z "$PR_BASE_SHA...$PR_HEAD_SHA" \
              | python3 scripts/ci_changed_scope.py \
                  --github-output "$GITHUB_OUTPUT" \
                  --summary "$GITHUB_STEP_SUMMARY"
          elif [[ "$EVENT_NAME" == "push" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --name-only -z "$PUSH_BEFORE_SHA" "$PUSH_HEAD_SHA" \
              | python3 scripts/ci_changed_scope.py \
                  --github-output "$GITHUB_OUTPUT" \
                  --summary "$GITHUB_STEP_SUMMARY"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            git ls-files -z \
              | python3 scripts/ci_changed_scope.py \
                  --github-output "$GITHUB_OUTPUT" \
                  --summary "$GITHUB_STEP_SUMMARY"
          else
            python3 scripts/ci_changed_scope.py \
              --force-full \
              --github-output "$GITHUB_OUTPUT" \
              --summary "$GITHUB_STEP_SUMMARY"
          fi

  # Stage 1: Fast static architecture fitness & JSON schemas check
  architecture-and-contracts:
    name: "Stage 1: Architecture Fitness & Contracts"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Check Architecture Fitness & Invariants
        run: |
          python3 scripts/check_architecture_fitness.py

      - name: Validate JSON Schemas
        run: |
          python3 -c "
          import json, glob
          product = glob.glob('contracts/schemas/*.schema.json')
          protocol = glob.glob('contracts/protocol/*.schema.json')
          engineering = glob.glob('contracts/engineering/*.schema.json')
          assert len(product) + len(protocol) >= 28, f'Expected >= 28 product/protocol schemas, found {len(product) + len(protocol)}'
          assert len(engineering) >= 3, f'Expected >= 3 engineering contracts, found {len(engineering)}'
          assert not glob.glob('contracts/schemas/task_capsule.schema.json'), 'engineering contract must not live in the product namespace'
          for p in product + protocol + engineering:
              with open(p) as f:
                  json.load(f)
          print(f'Validated {len(product)} product + {len(protocol)} protocol + {len(engineering)} engineering schemas.')
          "

      - name: Check Asset Size Budget & Store Layering
        # 治理入口：防止二进制资产无声把仓库撑大（单文件预算 + 二进制总量预算）。
        # 判据与分层策略见 docs/05_UI/artwork/Asset_Storage_Policy_v1.0.md。
        run: |
          python3 scripts/check_asset_hygiene.py

      - name: Verify Protected Gate Profile Registry
        run: |
          python3 scripts/gate_profile.py check

      - name: Verify Required-Check Contract
        run: |
          python3 scripts/check_required_checks.py

  # Stage 2: Python Engine & Contracts Test Suite (Apple Silicon runner, macOS 26+ baseline)
  python-engine:
    name: "Stage 2: Python Engine & Contracts"
    runs-on: macos-latest
    timeout-minutes: 10
    needs: [change-scope, architecture-and-contracts]
    if: ${{ needs.change-scope.outputs.run_python == 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install uv with Cache Enabled
        # setup-uv 自 v8 起不再发布大版本标签（供应链加固），必须锁不可变全版本标签。
        uses: astral-sh/setup-uv@v10.1.0
        with:
          # v10 起 `auto` 会对 pull_request_target / workflow_run / release 自动禁用缓存，
          # 避免缓存投毒；本工作流当前事件仍正常缓存，保留安全默认以便触发面变更后不被绕过。
          enable-cache: auto
          cache-dependency-glob: "engine/uv.lock"

      - name: Run Python Pytest Suite
        run: |
          cd engine
          uv run --locked --extra dev pytest -v

  # Stage 3: Swift 6 macOS App & IPC Protocol Roundtrip (macOS 26+ baseline)
  swift-macos-app:
    name: "Stage 3: Swift 6 App & Protocol Roundtrip"
    runs-on: macos-latest
    timeout-minutes: 10
    needs: [change-scope, architecture-and-contracts]
    if: ${{ needs.change-scope.outputs.run_swift == 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Select Xcode Toolchain
        run: |
          if [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          else
            echo "❌ 未找到 /Applications/Xcode.app：macOS 26+ / Xcode 27 基线要求显式工具链，拒绝静默降级。"
            exit 1
          fi
          swift --version

      - name: Run Swift 6 Test Suite
        run: |
          cd macos-app
          swift test --scratch-path "${RUNNER_TEMP}/wom-spm-scratch"

      - name: Build Xcode App Target (默认 MainActor 隔离编译验证)
        # SPM 测试目标未启用默认 MainActor 隔离，无法覆盖宿主 App 的真实编译面；
        # 该步骤复现 Xcode App Target / 预览的编译配置，避免「只在预览里报错」的问题漏过门禁。
        # CODE_SIGNING_ALLOWED=NO：本步骤只验证编译，不产出发行签名产物（Runner 无签名身份）。
        run: |
          cd macos-app
          xcodebuild -project WorldOfMysteries.xcodeproj \
            -scheme WorldOfMysteries \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "${RUNNER_TEMP}/wom-xcode-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build

  # Aggregated Gate Summary for Branch Protection
  all-gates-passed:
    name: "All Quality Gates Passed"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [change-scope, architecture-and-contracts, python-engine, swift-macos-app]
    if: always()
    steps:
      - name: Evaluate Pipeline Status
        run: |
          if [ "${{ needs.change-scope.result }}" != "success" ] || \
             [ "${{ needs.architecture-and-contracts.result }}" != "success" ]; then
            echo "❌ Scope or architecture gate failed."
            exit 1
          fi
          if [ "${{ needs.change-scope.outputs.run_python }}" = "true" ] && \
             [ "${{ needs.python-engine.result }}" != "success" ]; then
            echo "❌ Python gate was required but did not succeed."
            exit 1
          fi
          if [ "${{ needs.change-scope.outputs.run_swift }}" = "true" ] && \
             [ "${{ needs.swift-macos-app.result }}" != "success" ]; then
            echo "❌ Swift gate was required but did not succeed."
            exit 1
          fi
          echo "🎉 All selected CI gates passed; skipped platform jobs were out of scope."
