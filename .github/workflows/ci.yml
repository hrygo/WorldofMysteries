name: CI & Engineering Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Security Best Practice: Restrict top-level default permissions to read-only
permissions:
  contents: read

# Cancel redundant in-progress runs on new commits
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Stage 1: Fast static architecture fitness & JSON schemas check
  architecture-and-contracts:
    name: "Stage 1: Architecture Fitness & Contracts"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check Architecture Fitness & Invariants
        run: |
          python3 scripts/check_architecture_fitness.py

      - name: Validate JSON Schemas
        run: |
          python3 -c "
          import json, glob
          product = glob.glob('contracts/schemas/*.schema.json')
          protocol = glob.glob('contracts/protocol/*.schema.json')
          engineering = glob.glob('contracts/engineering/*.schema.json')
          assert len(product) + len(protocol) >= 28, f'Expected >= 28 product/protocol schemas, found {len(product) + len(protocol)}'
          assert len(engineering) >= 3, f'Expected >= 3 engineering contracts, found {len(engineering)}'
          assert not glob.glob('contracts/schemas/task_capsule.schema.json'), 'engineering contract must not live in the product namespace'
          for p in product + protocol + engineering:
              with open(p) as f:
                  json.load(f)
          print(f'Validated {len(product)} product + {len(protocol)} protocol + {len(engineering)} engineering schemas.')
          "

      - name: Verify Protected Gate Profile Registry
        run: |
          python3 scripts/gate_profile.py check

      - name: Verify Required-Check Contract
        run: |
          python3 scripts/check_required_checks.py

  # Stage 2: Python Engine & Contracts Test Suite (Apple Silicon runner, macOS 26+ baseline)
  python-engine:
    name: "Stage 2: Python Engine & Contracts"
    runs-on: macos-latest
    timeout-minutes: 10
    needs: [architecture-and-contracts]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install uv with Cache Enabled
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "engine/uv.lock"

      - name: Run Python Pytest Suite
        run: |
          cd engine
          uv lock --check
          uv run --locked --extra dev pytest -v

  # Stage 3: Swift 6 macOS App & IPC Protocol Roundtrip (macOS 26+ baseline)
  swift-macos-app:
    name: "Stage 3: Swift 6 App & Protocol Roundtrip"
    runs-on: macos-latest
    timeout-minutes: 10
    needs: [architecture-and-contracts]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Select Xcode Toolchain
        run: |
          if [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          else
            echo "❌ 未找到 /Applications/Xcode.app：macOS 26+ / Xcode 27 基线要求显式工具链，拒绝静默降级。"
            exit 1
          fi
          swift --version

      - name: Cache SPM Dependencies
        uses: actions/cache@v6
        with:
          path: macos-app/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('macos-app/Package.resolved', 'macos-app/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run Swift 6 Test Suite
        run: |
          cd macos-app
          swift test --scratch-path "${RUNNER_TEMP}/wom-spm-scratch"

      - name: Build Xcode App Target (默认 MainActor 隔离编译验证)
        # SPM 测试目标未启用默认 MainActor 隔离，无法覆盖宿主 App 的真实编译面；
        # 该步骤复现 Xcode App Target / 预览的编译配置，避免「只在预览里报错」的问题漏过门禁。
        # CODE_SIGNING_ALLOWED=NO：本步骤只验证编译，不产出发行签名产物（Runner 无签名身份）。
        run: |
          cd macos-app
          xcodebuild -project WorldOfMysteries.xcodeproj \
            -scheme WorldOfMysteries \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "${RUNNER_TEMP}/wom-xcode-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build

  # Aggregated Gate Summary for Branch Protection
  all-gates-passed:
    name: "All Quality Gates Passed"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [architecture-and-contracts, python-engine, swift-macos-app]
    if: always()
    steps:
      - name: Evaluate Pipeline Status
        run: |
          if [ "${{ needs.architecture-and-contracts.result }}" != "success" ] || \
             [ "${{ needs.python-engine.result }}" != "success" ] || \
             [ "${{ needs.swift-macos-app.result }}" != "success" ]; then
            echo "❌ One or more required quality gates failed!"
            exit 1
          fi
          echo "🎉 All local and CI gates PASSED successfully!"
