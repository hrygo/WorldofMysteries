name: Temporary publish domain contract parity
on:
  push:
    branches: [tmp/publish-contract-parity-a9c723]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: a9c7233594c4619cbedc02fe344c4d5d2fd1ebe7
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      - name: Materialize verified payload
        env:
          PAYLOAD_B64: 
        run: |
          git switch -C fix/domain-contract-parity a9c7233594c4619cbedc02fe344c4d5d2fd1ebe7
          python3 - <<'PY'
          import base64, io, os, tarfile
          raw=base64.b64decode(os.environ['PAYLOAD_B64'])
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as tar:
              tar.extractall('.', filter='data')
          PY
          git diff --check
      - name: Focused contract parity
        run: |
          cd engine
          uv run --locked --extra dev pytest -q tests/test_contracts_pydantic.py
      - name: Architecture fitness
        run: python3 scripts/check_architecture_fitness.py
      - name: Commit and publish one coherent increment
        run: |
          git config user.name "ChatGPT Engineering"
          git config user.email "noreply@openai.com"
          git add engine/contracts/models.py engine/tests/test_contracts_pydantic.py .agents/capsules/DOMAIN-CONTRACT-PARITY.json
          git commit -m "fix(contracts): restore canonical Python domain parity

Align Pydantic domain DTOs to the existing canonical JSON Schemas, reject legacy/unknown shapes, preserve JSON integer semantics and add Golden 001 positive/negative parity regression.

Refs #66, #43, #47."
          git push origin HEAD:refs/heads/fix/domain-contract-parity
