name: Temporary publish verified contract parity
on:
  push:
    branches: [tmp/contract-parity-publish-afdad64]
permissions:
  contents: write
jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/contract-parity-publish-afdad64
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      - name: Apply exact local-tested patch onto protected target base
        run: |
          set -euo pipefail
          cp .hacf/tmp/contract-parity.patch.gz.b64 "$RUNNER_TEMP/patch.b64"
          git fetch origin main
          test "$(git rev-parse origin/main)" = afdad649e07be3b01f54f1f53ba9a6651cda2d5f
          git checkout -B fix/domain-schema-parity origin/main
          base64 --decode "$RUNNER_TEMP/patch.b64" | gunzip > "$RUNNER_TEMP/contract-parity.patch"
          git apply --index --check "$RUNNER_TEMP/contract-parity.patch"
          git apply --index "$RUNNER_TEMP/contract-parity.patch"
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git diff --cached --check
      - name: Verify parity and architecture before publication
        run: |
          PYTHONPATH=engine python3 -m pytest -q engine/tests/test_contracts_schema.py engine/tests/test_contracts_pydantic.py contracts/tests/test_roundtrip.py contracts/tests/test_ipc_contract.py
          python3 scripts/check_architecture_fitness.py
      - name: Commit and publish feature branch
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "noreply@openai.com"
          git commit -m "fix(contracts): restore canonical Schema and Pydantic parity"
          git push --force-with-lease origin HEAD:refs/heads/fix/domain-schema-parity
