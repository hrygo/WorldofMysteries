name: ChatGPT W-V02 Capsule Refresh

on:
  push:
    branches:
      - feat/voice-v02-realtime-asr
    paths:
      - .github/workflows/chatgpt-wv02-capsules.yml

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'

      - name: Pack clean capsules from current main baseline
        run: |
          set -euo pipefail
          git fetch origin main
          BASE="$RUNNER_TEMP/wom-main"
          OUT="$RUNNER_TEMP/capsules"
          mkdir -p "$OUT"
          git worktree add --detach "$BASE" origin/main

          cd "$BASE"
          python3 scripts/agent_capsule.py pack \
            --role AGT-MAC \
            --task-id VOICE-V02-REALTIME-ASR-R2 \
            --title "Voice V02 Realtime ASR current-only SpeechRail 3.x alignment" \
            --focus "SpeechRail,realtime,ASR,transcription_session" \
            --risk-class medium \
            --supersedes CAP-VOICE-V02-REALTIME-ASR \
            --target-ref origin/main \
            --output "$OUT/VOICE-V02-REALTIME-ASR-R2.json"

          python3 scripts/agent_capsule.py pack \
            --role AGT-MAC \
            --task-id VOICE-V02-MIC-CAPTURE-R2 \
            --title "Voice V02 sandboxed microphone capture for SpeechRail 3.x" \
            --focus "microphone,PCM16,audio,input" \
            --risk-class privileged \
            --depends-on VOICE-V02-REALTIME-ASR-R2 \
            --grant-privileged "macos-app/Packaging/App.entitlements,macos-app/WorldOfMysteries.xcodeproj/project.pbxproj" \
            --supersedes CAP-VOICE-V02-MIC-CAPTURE \
            --target-ref origin/main \
            --output "$OUT/VOICE-V02-MIC-CAPTURE-R2.json"

          python3 scripts/agent_capsule.py pack \
            --role AGT-QA \
            --task-id VOICE-V02-PACKAGING-QA-R1 \
            --title "Voice V02 microphone entitlement packaging regression coverage" \
            --focus "packaging,entitlements,microphone" \
            --risk-class high \
            --target-ref origin/main \
            --output "$OUT/VOICE-V02-PACKAGING-QA-R1.json"

          python3 scripts/agent_capsule.py pack \
            --role AGT-ARB \
            --task-id VOICE-V02-GOVERNANCE-R1 \
            --title "Voice V02 entitlement scope governance alignment" \
            --focus "entitlements,privileged,grant,scope" \
            --risk-class privileged \
            --target-ref origin/main \
            --output "$OUT/VOICE-V02-GOVERNANCE-R1.json"

          for f in "$OUT"/*.json; do
            echo "===== $(basename "$f") ====="
            cat "$f"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: wv02-clean-capsules
          path: ${{ runner.temp }}/capsules/*.json
          if-no-files-found: error
          retention-days: 3
