name: Temporary Voice V01 contract close capsule pack
on:
  push:
    branches: ['tmp/voice-v01-pack-20260919']
    paths: ['.github/workflows/tmp-voice-v01-contract-close-pack.yml']
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/voice-v01-media-contract
          fetch-depth: 0
          persist-credentials: true
      - name: Pack contract close capsule
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GitHub Actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/agent_capsule.py pack             --role AGT-ARB             --task-id VOICE-V01-CONTRACT-CLOSE             --title 'Voice V01 media.open contract closure'             --focus 'contracts media open grant request response fixture protocol documentation'             --target-ref origin/main
          git add .agents/capsules/
          git commit -m 'chore(voice): pack VOICE-V01-CONTRACT-CLOSE task capsule'
          git push origin HEAD:refs/heads/feat/voice-v01-media-contract
