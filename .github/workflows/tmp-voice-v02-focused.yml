name: Temporary Voice V02 coordinator focused gate
on:
  push:
    branches: ['tmp/voice-v02-pack-20260919']
    paths: ['.github/workflows/tmp-voice-v02-focused.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 215222d5311d8a8f310b50946537c6aa2ed49951
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Focused coordinator tests
        working-directory: macos-app
        run: swift test --scratch-path "$RUNNER_TEMP/wom-v02-focused" --filter SpeechRailRealtimeASRTurnCoordinatorTests
