name: Temporary Voice V09 Turn Intake Preflight

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact W-V09 turn intake head
        uses: actions/checkout@v7
        with:
          ref: ac9b1d9f68cf3d5d5d6505dbe094fc53fa0aeb26
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: auto
          cache-dependency-glob: "engine/uv.lock"
      - name: Architecture fitness
        run: python3 scripts/check_architecture_fitness.py
      - name: Focused durable intake tests
        working-directory: engine
        run: uv run --locked --extra dev pytest -q tests/test_story_turn_intake.py tests/test_story_session_migration.py tests/test_golden_turn1_durable.py
