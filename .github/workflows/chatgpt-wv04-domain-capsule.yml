name: ChatGPT W-V04 Domain Capsule

on:
  push:
    branches: [feat/voice-v04-identity-domain]
    paths:
      - .github/workflows/chatgpt-wv04-domain-capsule.yml

permissions:
  contents: write

jobs:
  capsule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Pack W-V04 domain task
        run: |
          python3 scripts/agent_capsule.py pack \
            --role AGT-DOM \
            --task-id VOICE-V04-IDENTITY-DOMAIN \
            --title "Voice V04 immutable voice identity and binding domain" \
            --focus "voice identity,VoiceBinding,ProviderVoiceRevision,persona,revision,assurance" \
            --risk-class medium
      - name: Commit capsule and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/capsules/VOICE-V04-IDENTITY-DOMAIN.json
          git rm .github/workflows/chatgpt-wv04-domain-capsule.yml
          git commit -m "chore(voice): initialize W-V04 identity domain task"
          git push origin HEAD:feat/voice-v04-identity-domain
