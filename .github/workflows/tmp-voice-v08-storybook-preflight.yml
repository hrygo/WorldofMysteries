name: Temporary Voice V08 StoryBook Track Preflight

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact StoryBook track head
        uses: actions/checkout@v7
        with:
          ref: 4eac018364af9dd7c92773304a75596a6aaa4c55
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: auto
          cache-dependency-glob: "engine/uv.lock"
      - name: Architecture fitness
        run: python3 scripts/check_architecture_fitness.py
      - name: Focused StoryBook track and migration tests
        working-directory: engine
        run: uv run --locked --extra dev pytest -q tests/test_audio_track_repository.py tests/test_story_session_migration.py
