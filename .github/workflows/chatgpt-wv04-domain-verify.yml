name: ChatGPT W-V04 Domain Verify

on:
  push:
    branches: [feat/voice-v04-identity-domain]
    paths:
      - .github/workflows/chatgpt-wv04-domain-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: auto
          cache-dependency-glob: engine/uv.lock
      - name: Remove temporary verifier before scope audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-wv04-domain-verify.yml
          git commit -m "ci(voice): remove temporary W-V04 verifier"
          git push origin HEAD:feat/voice-v04-identity-domain
      - name: Verify domain capsule
        run: |
          python3 scripts/agent_capsule.py verify \
            --capsule .agents/capsules/VOICE-V04-IDENTITY-DOMAIN.json \
            --cwd "$GITHUB_WORKSPACE"
      - name: Commit fresh receipt
        run: |
          git add .agents/receipts/VOICE-V04-IDENTITY-DOMAIN/
          git diff --cached --check
          git commit -m "chore(evidence): attach W-V04 identity Work Receipt"
          git push origin HEAD:feat/voice-v04-identity-domain
