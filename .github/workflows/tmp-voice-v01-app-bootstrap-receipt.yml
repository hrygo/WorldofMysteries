name: Temporary Voice V01 app bootstrap receipt
on:
  push:
    branches: ['tmp/voice-v01-lifecycle-pack-20260919']
    paths: ['.github/workflows/tmp-voice-v01-app-bootstrap-receipt.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 07a800cc9696acc37fa6cf51c8fa997206b7e5ad
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: false
      - name: Verify app bootstrap task
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/agent_capsule.py verify             --capsule .agents/capsules/VOICE-V01-APP-BOOTSTRAP.json             --cwd "$GITHUB_WORKSPACE"
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: voice-v01-app-bootstrap-receipt
          path: .agents/receipts/VOICE-V01-APP-BOOTSTRAP/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn
