name: ChatGPT Sync Main for PR98

on:
  push:
    branches:
      - feat/voice-v00-effective-capabilities
    paths:
      - .github/workflows/chatgpt-sync-pr98.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Remove helper and merge latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-sync-pr98.yml
          git commit -m "ci: remove temporary PR98 sync helper"
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:feat/voice-v00-effective-capabilities
