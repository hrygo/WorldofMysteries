name: ChatGPT W-V00 Capabilities Bootstrap

on:
  push:
    branches:
      - feat/voice-v00-effective-capabilities
    paths:
      - .github/workflows/chatgpt-wv00-capabilities-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Generate repository-native capsule
        run: |
          python3 scripts/agent_capsule.py pack \
            --role AGT-VOICE \
            --task-id VOICE-V00-EFFECTIVE-CAPABILITIES \
            --title "Voice V00 consume SpeechRail effective capability snapshot" \
            --focus "capabilities,effective_capabilities_v1,SpeechRail,voice catalog" \
            --risk-class medium
      - name: Remove bootstrap workflow and commit capsule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-wv00-capabilities-bootstrap.yml
          git add .agents/capsules/VOICE-V00-EFFECTIVE-CAPABILITIES.json
          git diff --cached --check
          git commit -m "chore(voice): initialize W-V00 capability snapshot task"
          git push origin HEAD:feat/voice-v00-effective-capabilities
