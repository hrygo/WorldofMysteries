name: Temporary Voice V07 Sealed Model Identity Preflight

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact model-identity head
        uses: actions/checkout@v7
        with:
          ref: 97c281a4c5541766ecf24c7bbdcb6517ee875a1c
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: auto
          cache-dependency-glob: "engine/uv.lock"
      - name: Architecture fitness
        run: python3 scripts/check_architecture_fitness.py
      - name: Focused model identity tests
        working-directory: engine
        run: uv run --locked --extra dev pytest -q tests/test_speech_unit.py tests/test_voice_runtime.py tests/test_audio_adapter.py
