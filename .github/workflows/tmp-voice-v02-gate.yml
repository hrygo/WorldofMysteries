name: Temporary Voice V02 Swift gate
on:
  push:
    branches: ['tmp/voice-v02-pack-20260919']
    paths: ['.github/workflows/tmp-voice-v02-gate.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e595c3915103ff964898569a3818c14b2ddebdfe
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Swift tests
        working-directory: macos-app
        run: swift test --scratch-path "$RUNNER_TEMP/wom-v02-spm"
