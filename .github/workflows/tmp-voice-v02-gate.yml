name: Temporary Voice V02 Swift gate
on:
  push:
    branches: ['tmp/voice-v02-pack-20260919']
    paths: ['.github/workflows/tmp-voice-v02-gate.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ac4a670dd2a34ce5f6ab0408b01b0f6fd593a001
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Swift tests
        working-directory: macos-app
        run: swift test --scratch-path "$RUNNER_TEMP/wom-v02-spm"
      - name: Xcode App build
        working-directory: macos-app
        run: |
          xcodebuild -project WorldOfMysteries.xcodeproj -scheme WorldOfMysteries             -configuration Debug -destination 'platform=macOS,arch=arm64'             -derivedDataPath "$RUNNER_TEMP/wom-v02-xcode" build
