name: Temporary Voice V05 Swift Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose-swift:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Voice V05 policy head
        uses: actions/checkout@v7
        with:
          ref: c81312d4f0abfe4e33b810a58717c079de118b80
          fetch-depth: 0
          persist-credentials: false
      - name: Select Xcode toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version
      - name: Run Swift tests with full diagnostics
        working-directory: macos-app
        run: |
          set -o pipefail
          swift test --scratch-path .build 2>&1 | tee /tmp/swift-test.log
          status=${PIPESTATUS[0]}
          echo "===SWIFT_FAILURE_CONTEXT==="
          grep -nE "fail|error|Issue recorded|Expectation failed|Test Case|✘|XCTAssert|timed out|signal|fatal" /tmp/swift-test.log || true
          echo "===SWIFT_LOG_TAIL==="
          tail -n 500 /tmp/swift-test.log
          exit "$status"
