name: ChatGPT W-V04 Repack Verify

on:
  push:
    branches: [feat/voice-v04-identity-domain]
    paths:
      - .github/workflows/chatgpt-wv04-repack-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: auto
          cache-dependency-glob: engine/uv.lock

      - name: Repack revision 2 from clean pre-code base
        run: |
          current="$(git rev-parse HEAD)"
          git checkout --detach f228e4dfb8f388fc0a6341d87f81c2264c6aadd4
          python3 scripts/agent_capsule.py pack \
            --role AGT-DOM \
            --task-id VOICE-V04-IDENTITY-DOMAIN \
            --title "Voice V04 immutable voice identity and binding domain" \
            --focus "voice identity,VoiceBinding,ProviderVoiceRevision,persona,revision,assurance" \
            --risk-class medium \
            --supersedes CAP-VOICE-V04-IDENTITY-DOMAIN \
            --target-ref origin/main \
            --output /tmp/VOICE-V04-IDENTITY-DOMAIN.json
          git checkout "$current"
          cp /tmp/VOICE-V04-IDENTITY-DOMAIN.json .agents/capsules/VOICE-V04-IDENTITY-DOMAIN.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-wv04-repack-verify.yml
          git add .agents/capsules/VOICE-V04-IDENTITY-DOMAIN.json
          git diff --cached --check
          git commit -m "chore(voice): refresh W-V04 task capsule baseline"
          git push origin HEAD:feat/voice-v04-identity-domain

      - name: Verify revised domain capsule
        run: |
          python3 scripts/agent_capsule.py verify \
            --capsule .agents/capsules/VOICE-V04-IDENTITY-DOMAIN.json \
            --cwd "$GITHUB_WORKSPACE"

      - name: Commit fresh receipt
        run: |
          git add .agents/receipts/VOICE-V04-IDENTITY-DOMAIN/
          git diff --cached --check
          git commit -m "chore(evidence): attach W-V04 identity Work Receipt"
          git push origin HEAD:feat/voice-v04-identity-domain
