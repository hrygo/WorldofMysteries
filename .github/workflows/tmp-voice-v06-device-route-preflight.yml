name: Temporary Voice V06 Device Route Recovery Preflight

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact device-route recovery head
        uses: actions/checkout@v7
        with:
          ref: 6eab9c742b5b9874595ce31252b17cba409692fb
          fetch-depth: 0
          persist-credentials: false
      - name: Select Xcode toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version
      - name: Focused Swift playback recovery tests
        working-directory: macos-app
        run: swift test --scratch-path .build --filter EngineMediaDeviceRecoveryTests
