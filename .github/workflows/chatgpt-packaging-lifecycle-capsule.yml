name: ChatGPT Packaging Lifecycle Capsule

on:
  push:
    branches:
      - fix/packaging-release-app-probe
    paths:
      - .github/workflows/chatgpt-packaging-lifecycle-capsule.yml

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Remove temporary workflow from branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-packaging-lifecycle-capsule.yml
          git commit -m "ci(packaging): remove temporary lifecycle capsule workflow"
          git push origin HEAD:fix/packaging-release-app-probe

      - name: Generate repository-native macOS lifecycle capsule
        run: |
          python3 scripts/agent_capsule.py pack \
            --role AGT-MAC \
            --task-id PACKAGING-RELEASE-APP-LIFECYCLE-R1 \
            --title "Start bundled Engine before heavy App finish work" \
            --focus "EngineAppDelegate,EngineSessionTests,bootstrap,lifecycle" \
            --risk-class high
          python3 scripts/agent_capsule.py show \
            --capsule .agents/capsules/PACKAGING-RELEASE-APP-LIFECYCLE-R1.json

      - name: Commit capsule
        run: |
          git add .agents/capsules/PACKAGING-RELEASE-APP-LIFECYCLE-R1.json
          git diff --cached --check
          git commit -m "chore(packaging): add App lifecycle bootstrap capsule"
          git push origin HEAD:fix/packaging-release-app-probe
