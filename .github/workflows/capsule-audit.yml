name: PR Task Capsule & Evidence Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# 最小权限原则：审计只读仓库与 PR 元数据
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  audit-capsule-scope:
    name: "Audit Task Capsule Scope, Gate Sovereignty & Receipt Evidence"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code with History
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Verify PR-side Gate Profiles against Protected Registry
        run: |
          python3 scripts/gate_profile.py check

      - name: Audit Capsule Scope, Gate Sovereignty & Receipt Evidence
        run: |
          python3 scripts/capsule_audit.py \
            --base-ref "origin/${{ github.base_ref }}" \
            --head-ref HEAD
