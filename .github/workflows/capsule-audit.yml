name: PR Task Capsule & Evidence Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# 最小权限原则：审计只读仓库与 PR 元数据
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  audit-capsule-scope:
    # ⚠️ 检查名是公开接口：分支保护按名字匹配必需检查，改名会让所有 PR 永久 pending。
    # 该名字受 .hacf/required-checks.json 契约与 scripts/check_required_checks.py 守卫。
    name: "Capsule Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code with History
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Verify PR-side Gate Profiles against Protected Registry
        run: |
          python3 scripts/gate_profile.py check

      - name: Audit Capsule Scope, Gate Sovereignty & Receipt Evidence
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          python3 scripts/capsule_audit.py \
            --base-ref "origin/$BASE_REF" \
            --head-ref HEAD
