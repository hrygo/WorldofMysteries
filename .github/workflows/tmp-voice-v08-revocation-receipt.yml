name: Temporary Voice V08 Revocation Receipt Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact W-V08 revocation head
        uses: actions/checkout@v7
        with:
          ref: a61c4aaaca5cd306fa04e8be859adf2f9809e49b
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: auto
          cache-dependency-glob: "engine/uv.lock"
      - name: Select Xcode toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          swift --version
      - name: Verify capsule and print Work Receipt
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a61c4aaaca5cd306fa04e8be859adf2f9809e49b"
          python3 scripts/agent_capsule.py verify \
            --capsule .agents/capsules/VOICE-V08-REVOCATION-REDUB.json
          receipt=".agents/receipts/VOICE-V08-REVOCATION-REDUB/a61c4aaaca5c.json"
          test -f "$receipt"
          echo "===WORK_RECEIPT_BEGIN==="
          cat "$receipt"
          echo "===WORK_RECEIPT_END==="
